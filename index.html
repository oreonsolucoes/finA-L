<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<meta name="description" content="Livro de contas compartilhado — despesas, saldo e acerto do mês.">
<title>Livro de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="n8n-sender.js"></script>
<style>
:root{
  --paper:#F2EFE7;
  --paper-2:#EAE6DC;
  --card:#FCFBF7;
  --rule:#DCD6C8;
  --rule-soft:#E8E3D7;

  --ink:#1C1A17;
  --ink-2:#5A554C;
  --ink-3:#928C80;

  --accent:#1F5D50;
  --accent-soft:#E1EDE9;
  --accent-ink:#164A40;

  --debit:#9E3B2F;
  --debit-soft:#F6E4E1;
  --warn:#8A6410;
  --warn-soft:#F6EEDC;

  --c-moradia:#1F5D50;
  --c-mercado:#8A6410;
  --c-transporte:#2C5578;
  --c-saude:#9E3B2F;
  --c-lazer:#5D4680;
  --c-assinaturas:#7A4A66;
  --c-outros:#5A554C;

  --shadow-1:0 1px 2px rgba(28,26,23,.05);
  --shadow-2:0 1px 3px rgba(28,26,23,.06), 0 10px 28px -8px rgba(28,26,23,.14);
  --shadow-3:0 24px 60px -12px rgba(28,26,23,.28);

  --r-sm:8px; --r:12px; --r-lg:18px;

  --serif:'Instrument Serif', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'Roboto Mono', ui-monospace, monospace;

  --ease:cubic-bezier(.32,.72,0,1);
}

@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --paper:#141412; --paper-2:#0F0F0E; --card:#1C1B18; --rule:#33312C; --rule-soft:#282721;
    --ink:#F0EDE5; --ink-2:#A8A296; --ink-3:#6E695E;
    --accent:#5FBFA8; --accent-soft:#16302A; --accent-ink:#7FD3BE;
    --debit:#E07A6B; --debit-soft:#331D19; --warn:#D9A63C; --warn-soft:#2E2517;
    --c-moradia:#5FBFA8; --c-mercado:#D9A63C; --c-transporte:#6FA3D2;
    --c-saude:#E07A6B; --c-lazer:#A98BD4; --c-assinaturas:#CE8DB4; --c-outros:#A8A296;
    --shadow-2:0 1px 3px rgba(0,0,0,.4), 0 10px 28px -8px rgba(0,0,0,.5);
    --shadow-3:0 24px 60px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#141412; --paper-2:#0F0F0E; --card:#1C1B18; --rule:#33312C; --rule-soft:#282721;
  --ink:#F0EDE5; --ink-2:#A8A296; --ink-3:#6E695E;
  --accent:#5FBFA8; --accent-soft:#16302A; --accent-ink:#7FD3BE;
  --debit:#E07A6B; --debit-soft:#331D19; --warn:#D9A63C; --warn-soft:#2E2517;
  --c-moradia:#5FBFA8; --c-mercado:#D9A63C; --c-transporte:#6FA3D2;
  --c-saude:#E07A6B; --c-lazer:#A98BD4; --c-assinaturas:#CE8DB4; --c-outros:#A8A296;
  --shadow-2:0 1px 3px rgba(0,0,0,.4), 0 10px 28px -8px rgba(0,0,0,.5);
  --shadow-3:0 24px 60px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100dvh;
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;}
button{cursor:pointer;}
[hidden]{display:none !important;}
*:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
::selection{background:var(--accent-soft); color:var(--accent-ink);}

.wrap{max-width:820px; margin:0 auto; padding:0 20px;}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--rule);}
.topbar-in{
  max-width:820px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:12px;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0;}
.brand-mark{
  font-family:var(--serif); font-style:italic; font-size:23px; line-height:1;
  color:var(--ink); white-space:nowrap;
}
.brand-sub{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
@media(max-width:560px){ .brand-sub{display:none;} }

.people{display:flex; align-items:center;}
.people .avatar:not(:first-child){margin-left:-7px;}
.avatar{
  width:28px; height:28px; border-radius:50%;
  display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:600; color:#fff;
  border:2px solid var(--paper); flex-shrink:0;
}
.avatar.sm{width:20px; height:20px; font-size:9px; border-width:1.5px;}

.iconbtn{
  width:34px; height:34px; border-radius:9px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink-2);
  display:grid; place-items:center;
  transition:background .15s, color .15s, border-color .15s;
}
.iconbtn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}

/* ============ MONTH NAV ============ */
.monthnav{
  display:flex; align-items:center; justify-content:center; gap:4px;
  padding:22px 0 18px;
}
.monthnav button{
  width:32px; height:32px; border-radius:8px; border:none; background:none;
  color:var(--ink-3); display:grid; place-items:center; transition:background .15s,color .15s;
}
.monthnav button:hover:not(:disabled){background:var(--paper-2); color:var(--ink);}
.monthnav button:disabled{opacity:.25; cursor:default;}
.month-label{
  font-family:var(--serif); font-size:27px; line-height:1;
  min-width:190px; text-align:center; text-transform:capitalize;
  border:none; background:none; color:var(--ink); padding:4px 8px; border-radius:8px;
}
.month-label:hover{background:var(--paper-2);}
.month-label .yr{color:var(--ink-3);}
.today-jump{
  display:block; margin:6px auto 0; border:none; background:none;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); padding:3px 8px; border-radius:6px;
}
.today-jump:hover{background:var(--accent-soft);}

/* ============ LEDGER CARD (signature) ============ */
.ledger-card{
  background:var(--card); border-radius:var(--r-lg);
  box-shadow:var(--shadow-2); border:1px solid var(--rule-soft);
  overflow:hidden; margin-bottom:26px;
}
.lc-head{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  padding:20px 22px 16px;
}
.lc-eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 7px;
}
.lc-balance{
  font-family:var(--mono); font-weight:600; font-size:34px; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; margin:0;
  display:flex; align-items:center; gap:9px;
}
@media(max-width:420px){ .lc-balance{font-size:28px;} }
.lc-balance.neg{color:var(--debit);}
.lc-note{margin:8px 0 0; font-size:12.5px; color:var(--ink-3);}
.lc-note b{color:var(--ink-2); font-weight:600;}

.editbtn{
  width:24px; height:24px; border-radius:6px; border:none; background:none;
  color:var(--ink-3); display:grid; place-items:center; flex-shrink:0;
  transition:background .15s,color .15s;
}
.editbtn:hover{background:var(--accent-soft); color:var(--accent);}

/* the ruled strip — the signature element */
.lc-rule{
  height:1px; margin:0 22px;
  background:repeating-linear-gradient(90deg, var(--rule) 0 5px, transparent 5px 10px);
}
.lc-body{padding:16px 22px 20px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
@media(max-width:560px){ .lc-body{grid-template-columns:1fr 1fr; gap:16px 14px;} }
.lc-cell .k{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 5px;
}
.lc-cell .v{
  font-family:var(--mono); font-weight:600; font-size:17px; line-height:1.15;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.lc-cell .v.debit{color:var(--debit);}
.lc-cell .v.ok{color:var(--accent);}
.lc-cell .s{font-size:11.5px; color:var(--ink-3); margin-top:3px;}

/* progress bar of month */
.paidbar{margin:0 22px 18px;}
.paidbar-track{
  height:5px; border-radius:100px; background:var(--paper-2); overflow:hidden;
  display:flex;
}
.paidbar-fill{background:var(--accent); transition:width .5s var(--ease);}
.paidbar-late{background:var(--debit); transition:width .5s var(--ease);}
.paidbar-legend{
  display:flex; justify-content:space-between; margin-top:7px;
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-3);
}

/* ============ SETTLEMENT ============ */
.settle{
  display:flex; align-items:center; gap:12px;
  padding:13px 22px; border-top:1px solid var(--rule-soft);
  background:var(--paper-2);
}
.settle-txt{flex:1; min-width:0; font-size:13px; color:var(--ink-2); line-height:1.4;}
.settle-txt b{color:var(--ink); font-weight:600;}
.settle-amt{font-family:var(--mono); font-weight:600; font-size:15px; color:var(--ink); white-space:nowrap;}

/* ============ BUTTONS ============ */
.btn{
  border:none; border-radius:10px; padding:10px 16px;
  font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s var(--ease), box-shadow .15s, background .15s, color .15s;
}
.btn:active{transform:scale(.975);}
.btn-primary{background:var(--accent); color:var(--card); box-shadow:var(--shadow-1);}
.btn-primary:hover{box-shadow:0 4px 16px -4px color-mix(in srgb, var(--accent) 60%, transparent);}
.btn-ghost{background:transparent; color:var(--ink-2); border:1px solid var(--rule);}
.btn-ghost:hover{background:var(--paper-2); color:var(--ink);}
.btn-text{background:none; color:var(--ink-2); padding:9px 12px;}
.btn-text:hover{color:var(--ink);}
.btn-danger{background:var(--debit); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:default; transform:none; box-shadow:none;}
.btn-block{width:100%;}

/* ============ TOOLBAR / FILTERS ============ */
.toolbar{
  display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
}
.segmented{
  display:flex; gap:2px; padding:3px; border-radius:10px;
  background:var(--paper-2); border:1px solid var(--rule-soft);
  overflow-x:auto; scrollbar-width:none; margin-right:auto;
}
.segmented::-webkit-scrollbar{display:none;}
.seg{
  border:none; background:none; padding:6px 12px; border-radius:7px;
  font-size:12.5px; font-weight:600; color:var(--ink-3); white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
  transition:background .15s, color .15s;
}
.seg:hover{color:var(--ink);}
.seg.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow-1);}
.seg .cnt{
  font-family:var(--mono); font-size:10.5px; font-weight:500;
  padding:1px 5px; border-radius:100px; background:var(--rule-soft); color:var(--ink-3);
}
.seg.active .cnt{background:var(--accent-soft); color:var(--accent);}
.seg.alert .cnt{background:var(--debit-soft); color:var(--debit);}

/* ============ LEDGER ROWS ============ */
.daygroup{margin-bottom:4px;}
.daygroup-head{
  display:flex; align-items:center; gap:10px;
  padding:14px 4px 8px;
}
.daygroup-date{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
.daygroup-line{flex:1; height:1px; background:var(--rule-soft);}
.daygroup-sum{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.daygroup.is-late .daygroup-date{color:var(--debit);}

.row{
  display:flex; align-items:center; gap:13px;
  background:var(--card); border:1px solid var(--rule-soft);
  border-left:3px solid var(--ink-3);
  border-radius:var(--r); padding:12px 14px; margin-bottom:7px;
  transition:box-shadow .15s, transform .12s var(--ease), opacity .2s;
}
.row:hover{box-shadow:var(--shadow-2);}
.row.paid{opacity:.62;}
.row.paid .row-desc{text-decoration:line-through; text-decoration-color:var(--ink-3); text-decoration-thickness:1px;}
.row.flash{animation:flash .8s var(--ease);}
@keyframes flash{0%{background:var(--accent-soft);} 100%{background:var(--card);}}

.tickbox{
  width:22px; height:22px; border-radius:7px; flex-shrink:0;
  border:1.5px solid var(--rule); background:transparent;
  display:grid; place-items:center; color:transparent;
  transition:background .15s, border-color .15s, color .15s;
}
.tickbox:hover{border-color:var(--accent); color:var(--ink-3);}
.tickbox.on{background:var(--accent); border-color:var(--accent); color:#fff;}

.row-main{flex:1; min-width:0;}
.row-desc{
  font-weight:600; font-size:14.5px; letter-spacing:-.01em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row-meta{
  display:flex; align-items:center; gap:8px; margin-top:3px; flex-wrap:wrap;
  font-size:11.5px; color:var(--ink-3);
}
.tag{
  font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  padding:2px 7px; border-radius:5px; white-space:nowrap;
}
.late-flag{color:var(--debit); font-weight:600;}
.recur-icon{display:inline-flex; color:var(--ink-3);}

.row-right{display:flex; align-items:center; gap:11px; flex-shrink:0;}
.row-amt{
  font-family:var(--mono); font-weight:600; font-size:15.5px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; text-align:right;
}
.row-menu{
  width:28px; height:28px; border-radius:7px; border:none; background:none;
  color:var(--ink-3); display:grid; place-items:center; flex-shrink:0;
  transition:background .15s, color .15s;
}
.row-menu:hover{background:var(--paper-2); color:var(--ink);}

@media(max-width:520px){
  .row{flex-wrap:wrap; gap:11px;}
  .row-right{width:100%; justify-content:space-between; padding-left:35px; margin-top:-4px;}
  .row-amt{font-size:16px;}
}

/* ============ EMPTY / LOADING ============ */
.empty{text-align:center; padding:56px 24px; color:var(--ink-3);}
.empty svg{opacity:.4; margin-bottom:14px;}
.empty h3{
  font-family:var(--serif); font-size:21px; font-weight:400; color:var(--ink-2);
  margin:0 0 6px;
}
.empty p{margin:0 auto 18px; font-size:13.5px; max-width:34ch; line-height:1.55;}

.skeleton{padding:28px 20px;}
.sk{background:var(--paper-2); border-radius:var(--r); animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.5;}}

/* ============ FAB ============ */
.fab{
  position:fixed; right:20px; z-index:25;
  bottom:calc(20px + env(safe-area-inset-bottom));
  height:50px; padding:0 20px; border-radius:100px; border:none;
  background:var(--accent); color:var(--card);
  font-size:14px; font-weight:600; letter-spacing:-.01em;
  display:inline-flex; align-items:center; gap:8px;
  box-shadow:0 6px 24px -6px color-mix(in srgb, var(--accent) 70%, transparent), var(--shadow-1);
  transition:transform .16s var(--ease), box-shadow .2s;
}
.fab:hover{transform:translateY(-2px);}
.fab:active{transform:scale(.96);}
@media(max-width:520px){ .fab{left:20px; right:20px; justify-content:center;} }

/* ============ SHEET / MODAL ============ */
.scrim{
  position:fixed; inset:0; z-index:40;
  background:rgba(20,20,18,.42);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.sheet{
  background:var(--card); border-radius:var(--r-lg);
  box-shadow:var(--shadow-3); border:1px solid var(--rule-soft);
  width:100%; max-width:440px; max-height:min(88dvh, 760px);
  display:flex; flex-direction:column;
  animation:rise .26s var(--ease);
}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985);} to{opacity:1; transform:none;}}
.sheet-head{
  display:flex; align-items:center; gap:12px;
  padding:18px 20px 14px; border-bottom:1px solid var(--rule-soft);
}
.sheet-head h3{font-family:var(--serif); font-size:22px; font-weight:400; margin:0; flex:1;}
.sheet-body{padding:18px 20px; overflow-y:auto; flex:1;}
.sheet-foot{
  display:flex; justify-content:flex-end; gap:9px;
  padding:14px 20px; border-top:1px solid var(--rule-soft);
}
@media(max-width:520px){
  .scrim{align-items:flex-end; padding:0;}
  .sheet{
    max-width:none; border-radius:var(--r-lg) var(--r-lg) 0 0;
    max-height:92dvh; padding-bottom:env(safe-area-inset-bottom);
    animation:slideUp .28s var(--ease);
  }
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:none;}}
}

/* ============ FORM ============ */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:13px 12px;}
@media(max-width:400px){ .grid2{grid-template-columns:1fr;} }
.f{display:flex; flex-direction:column; gap:6px;}
.f.wide{grid-column:1/-1;}
.f > label{
  font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3);
}
.f input[type=text], .f input[type=number], .f input[type=date],
.f input[type=email], .f input[type=password], .f select{
  border:1px solid var(--rule); border-radius:9px;
  padding:10px 11px; font-size:15px; background:var(--paper);
  color:var(--ink); width:100%; transition:border-color .15s, background .15s;
}
.f input:focus, .f select:focus{border-color:var(--accent); background:var(--card); outline:none;}
.f input::placeholder{color:var(--ink-3);}
.f .hint{font-size:11.5px; color:var(--ink-3); line-height:1.45;}

.money{position:relative;}
.money > span{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:13px; color:var(--ink-3); pointer-events:none;
}
.money input{padding-left:36px !important; font-family:var(--mono); font-size:17px !important; font-weight:600;}

.pills{display:flex; gap:7px; flex-wrap:wrap;}
.pill{
  border:1.5px solid var(--rule); background:var(--paper); border-radius:8px;
  padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px;
  transition:border-color .15s, background .15s, color .15s;
}
.pill .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.pill:hover{border-color:var(--ink-3);}
.pill.on{border-color:currentColor; background:var(--card);}

.split{display:flex; gap:7px;}
.split .pill{flex:1; justify-content:center;}

.check{
  display:flex; align-items:center; gap:10px; grid-column:1/-1;
  padding:11px 12px; border:1px solid var(--rule); border-radius:9px;
  background:var(--paper); cursor:pointer; transition:border-color .15s, background .15s;
}
.check:hover{border-color:var(--ink-3);}
.check input{width:17px; height:17px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;}
.check .lbl{font-size:13.5px; font-weight:500; color:var(--ink);}
.check .sub{font-size:11.5px; color:var(--ink-3); margin-top:1px;}

.section{margin-bottom:22px;}
.section:last-child{margin-bottom:0;}
.section > h4{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 10px; font-weight:500;
}
.warnbox{
  font-size:13px; color:var(--ink-2); line-height:1.55; margin:0 0 4px;
  padding:12px 13px; border-radius:9px; background:var(--debit-soft); border:1px solid transparent;
}
.warnbox b{color:var(--ink);}

.menu-item{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:11px 12px; border-radius:9px; border:none; background:none;
  font-size:14px; font-weight:500; color:var(--ink); text-align:left;
  transition:background .15s;
}
.menu-item:hover{background:var(--paper-2);}
.menu-item.danger{color:var(--debit);}
.menu-item.danger:hover{background:var(--debit-soft);}
.menu-item svg{color:var(--ink-3); flex-shrink:0;}
.menu-item.danger svg{color:var(--debit);}

/* ============ TOAST ============ */
#toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--paper);
  padding:11px 18px; border-radius:100px; font-size:13px; font-weight:500;
  box-shadow:var(--shadow-3); opacity:0; pointer-events:none;
  transition:opacity .22s, transform .22s var(--ease);
  max-width:calc(100vw - 40px); text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--debit); color:#fff;}

/* ============ AUTH GATE ============ */
.gate{
  min-height:100dvh; display:grid; place-items:center; padding:24px;
}
.gate-shell{
  width:100%; max-width:880px; background:var(--card);
  border:1px solid var(--rule-soft); border-radius:var(--r-lg);
  box-shadow:var(--shadow-2); overflow:hidden;
  display:grid; grid-template-columns:1.05fr .95fr;
}
.gate-photo{
  position:relative; min-height:430px;
  background:var(--paper-2) center/cover no-repeat;
}
.gate-photo::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(20,20,18,0) 38%,
    rgba(20,20,18,.34) 66%,
    rgba(20,20,18,.72) 100%);
}
.gate-photo figcaption{
  position:absolute; left:26px; right:26px; bottom:24px; z-index:1;
  color:#fff;
}
.gate-photo .cap-mark{
  font-family:var(--serif); font-style:italic; font-size:29px; line-height:1.1;
  margin:0 0 6px; text-shadow:0 1px 12px rgba(0,0,0,.4);
}
.gate-photo .cap-sub{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  margin:0; opacity:.86; text-shadow:0 1px 8px rgba(0,0,0,.5);
}
.gate-card{
  padding:38px 34px; display:flex; flex-direction:column; justify-content:center;
}
@media(max-width:720px){
  .gate{padding:0; align-items:stretch;}
  .gate-shell{
    grid-template-columns:1fr; max-width:none; min-height:100dvh;
    border:none; border-radius:0; box-shadow:none;
  }
  .gate-photo{min-height:190px;}
  .gate-photo .cap-mark{font-size:25px;}
  .gate-card{padding:28px 24px 34px; justify-content:flex-start;}
}
.gate-mark{font-family:var(--serif); font-style:italic; font-size:31px; margin:0 0 4px; line-height:1;}
.gate-sub{font-size:13.5px; color:var(--ink-3); margin:0 0 24px; line-height:1.5;}
.gate-err{
  font-size:12.5px; color:var(--debit); margin:12px 0 0; line-height:1.45;
}
.gate-alt{
  margin:18px 0 0; text-align:center; font-size:12.5px; color:var(--ink-3);
}
.gate-alt button{
  border:none; background:none; color:var(--accent); font-weight:600; font-size:12.5px; padding:2px;
}
.gate-alt button:hover{text-decoration:underline;}

.footer{
  text-align:center; padding:34px 20px 24px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════════
   CONFIGURAÇÃO
   ═══════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyC8hKLZ_pKHJ7DlS6OqvDvqzPk9FN3-8OM",
  authDomain: "financas-ael.firebaseapp.com",
  databaseURL: "https://financas-ael-default-rtdb.firebaseio.com",
  projectId: "financas-ael",
  storageBucket: "financas-ael.firebasestorage.app",
  messagingSenderId: "928624497972",
  appId: "1:928624497972:web:7204275e84d1ac40e84161"
};

// ID do livro compartilhado. Ambos do casal usam o mesmo.
const LIVRO_ID = "casa";
window.LIVRO_ID = LIVRO_ID;   // n8n-sender.js lê daqui para marcar o evento

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

/* ═══════════════════════════════════════════════════════════════
   CONSTANTES
   ═══════════════════════════════════════════════════════════════ */

const CATEGORIAS = [
  { id:"moradia",     nome:"Moradia",     cor:"var(--c-moradia)" },
  { id:"mercado",     nome:"Mercado",     cor:"var(--c-mercado)" },
  { id:"transporte",  nome:"Transporte",  cor:"var(--c-transporte)" },
  { id:"saude",       nome:"Saúde",       cor:"var(--c-saude)" },
  { id:"assinaturas", nome:"Assinaturas", cor:"var(--c-assinaturas)" },
  { id:"lazer",       nome:"Lazer",       cor:"var(--c-lazer)" },
  { id:"outros",      nome:"Outros",      cor:"var(--c-outros)" }
];

const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];

const PALETA_PESSOA = ["#1F5D50","#9E3B2F","#2C5578","#5D4680"];

/* ═══════════════════════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════════════════════ */

const S = {
  user: null,
  authReady: false,
  dataReady: false,
  authMode: "login",
  authErr: "",
  authBusy: false,

  saldoBase: 0,        // saldo informado manualmente
  saldoBaseEm: null,   // data ISO da última conferência
  perfis: [],
  despesas: [],        // array derivado do objeto do Firebase

  mesAtivo: mesAtualISO(),
  filtro: "todas",
  modal: null,
  tema: localStorage.getItem("tema") || "auto"
};

document.documentElement.dataset.theme = S.tema;

const root  = document.getElementById("root");
const toast = document.getElementById("toast");

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */

function uid(){
  return crypto.randomUUID ? crypto.randomUUID()
       : "id-"+Date.now()+"-"+Math.random().toString(36).slice(2,9);
}
function hojeISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function mesAtualISO(){ return hojeISO().slice(0,7); }

function money(v){
  return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function moneyShort(v){
  const n = Number(v)||0;
  return (n<0?"−":"") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtData(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtDiaLongo(iso){
  const dt = new Date(iso+"T12:00:00");
  const dia = String(dt.getDate()).padStart(2,"0");
  const sem = ["dom","seg","ter","qua","qui","sex","sáb"][dt.getDay()];
  return `${sem} ${dia}/${String(dt.getMonth()+1).padStart(2,"0")}`;
}
function diasDe(iso){
  const a = new Date(iso+"T00:00:00"), b = new Date(hojeISO()+"T00:00:00");
  return Math.round((b-a)/864e5);
}
function addMes(ym, delta){
  let [y,m] = ym.split("-").map(Number);
  m += delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return `${y}-${String(m).padStart(2,"0")}`;
}
function labelMes(ym){
  const [y,m] = ym.split("-").map(Number);
  return { nome: MESES[m-1], ano: y };
}
function cat(id){ return CATEGORIAS.find(c=>c.id===id) || CATEGORIAS[CATEGORIAS.length-1]; }
function pessoa(id){ return S.perfis.find(p=>p.id===id) || S.perfis[0] || {id:"?",nome:"?",cor:"#888"}; }
function inicial(nome){ return (nome||"?").trim().charAt(0).toUpperCase(); }

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function atrasada(d){ return !d.pago && d.vencimento < hojeISO(); }

function say(msg, erro){
  toast.textContent = msg;
  toast.classList.toggle("err", !!erro);
  toast.classList.add("show");
  clearTimeout(say._t);
  say._t = setTimeout(()=> toast.classList.remove("show"), 3400);
}

/* ═══════════════════════════════════════════════════════════════
   WEBHOOK (não bloqueia a UI, falha em silêncio)
   ═══════════════════════════════════════════════════════════════ */

function avisarN8N(acao, dados){
  // n8n-sender.js cuida de timeout, reenvio e fila offline.
  // Se o arquivo não carregar, o app segue normal — automação é opcional.
  if(typeof window.dispararWebhookN8N !== "function") return;
  try{ window.dispararWebhookN8N(acao, dados); }
  catch(e){ /* nunca deixar a automação travar a interface */ }
}

/* ═══════════════════════════════════════════════════════════════
   FIREBASE — leitura e escrita granular
   ═══════════════════════════════════════════════════════════════ */

function refLivro(){ return db.ref("livros/"+LIVRO_ID); }

let unsubs = [];

function ouvirDados(){
  desligarDados();

  const rMeta = refLivro().child("meta");
  const rDesp = refLivro().child("despesas");

  const h1 = rMeta.on("value", snap => {
    const m = snap.val() || {};
    S.saldoBase   = Number(m.saldoBase) || 0;
    S.saldoBaseEm = m.saldoBaseEm || null;
    S.perfis      = m.perfis && m.perfis.length ? m.perfis : perfisPadrao();
    S.dataReady = true;
    render();
  }, err => {
    S.dataReady = true;
    say("Sem permissão para ler o livro. Confira as regras do banco.", true);
    render();
  });

  // objeto por chave => duas pessoas podem escrever ao mesmo tempo
  const h2 = rDesp.on("value", snap => {
    const obj = snap.val() || {};
    S.despesas = Object.keys(obj).map(k => Object.assign({ id:k }, obj[k]));
    S.dataReady = true;
    render();
  }, err => { S.dataReady = true; render(); });

  unsubs = [
    ()=> rMeta.off("value", h1),
    ()=> rDesp.off("value", h2)
  ];
}
function desligarDados(){ unsubs.forEach(f=>f()); unsubs = []; }

function perfisPadrao(){
  const nome = (S.user && (S.user.displayName || (S.user.email||"").split("@")[0])) || "Você";
  return [
    { id:"p1", nome: nome.slice(0,20), cor: PALETA_PESSOA[0] },
    { id:"p2", nome:"Parceiro(a)",     cor: PALETA_PESSOA[1] }
  ];
}

async function salvarMeta(patch){
  try{ await refLivro().child("meta").update(patch); }
  catch(e){ say("Não foi possível salvar. Verifique a conexão.", true); }
}
async function gravarDespesa(id, dados){
  try{ await refLivro().child("despesas/"+id).update(dados); }
  catch(e){ say("Não foi possível salvar a despesa.", true); }
}
async function apagarDespesa(id){
  try{ await refLivro().child("despesas/"+id).remove(); }
  catch(e){ say("Não foi possível excluir.", true); }
}

/* ═══════════════════════════════════════════════════════════════
   CÁLCULOS DERIVADOS
   O saldo nunca é mutado por evento. Ele é sempre recalculado a
   partir do saldo-base + os pagamentos posteriores àquela data.
   Assim ele é reconstruível e não desanda com dois dispositivos.
   ═══════════════════════════════════════════════════════════════ */

function saldoAtual(){
  const desde = S.saldoBaseEm;
  const pagosDepois = S.despesas.filter(d =>
    d.pago && d.dataPagamento && (!desde || d.dataPagamento > desde)
  );
  const gasto = pagosDepois.reduce((s,d)=> s + (Number(d.valor)||0), 0);
  return S.saldoBase - gasto;
}

function doMes(ym){
  return S.despesas.filter(d => (d.vencimento||"").slice(0,7) === ym);
}

function resumo(ym){
  const lista = doMes(ym);
  const pagas    = lista.filter(d=>d.pago);
  const abertas  = lista.filter(d=>!d.pago);
  const atrasadas= lista.filter(atrasada);

  const total    = lista.reduce((s,d)=>s+(Number(d.valor)||0),0);
  const vlPago   = pagas.reduce((s,d)=>s+(Number(d.valor)||0),0);
  const vlAberto = abertas.reduce((s,d)=>s+(Number(d.valor)||0),0);
  const vlAtraso = atrasadas.reduce((s,d)=>s+(Number(d.valor)||0),0);

  return {
    lista, total, vlPago, vlAberto, vlAtraso,
    nTodas: lista.length, nPagas: pagas.length,
    nAbertas: abertas.length, nAtrasadas: atrasadas.length,
    pctPago: total>0 ? (vlPago/total)*100 : 0,
    pctAtraso: total>0 ? (vlAtraso/total)*100 : 0
  };
}

/* Quem deve a quem: soma o que cada um pagou de despesas
   marcadas como compartilhadas e divide por dois. */
function acerto(ym){
  const compartilhadas = doMes(ym).filter(d => d.pago && d.divisao !== "individual");
  if(compartilhadas.length === 0 || S.perfis.length < 2) return null;

  const porPessoa = {};
  S.perfis.forEach(p => porPessoa[p.id] = 0);
  compartilhadas.forEach(d => {
    const quem = d.pagoPor || d.adicionadoPor || S.perfis[0].id;
    if(porPessoa[quem] === undefined) porPessoa[quem] = 0;
    porPessoa[quem] += Number(d.valor)||0;
  });

  const total = Object.values(porPessoa).reduce((a,b)=>a+b,0);
  const justo = total / S.perfis.length;

  const a = S.perfis[0], b = S.perfis[1];
  const difA = (porPessoa[a.id]||0) - justo;

  if(Math.abs(difA) < 0.01) return { quitado:true, total };

  const devedor  = difA > 0 ? b : a;
  const credor   = difA > 0 ? a : b;
  return { quitado:false, devedor, credor, valor: Math.abs(difA), total };
}

/* ═══════════════════════════════════════════════════════════════
   RECORRÊNCIA
   Ao abrir um mês, materializa as despesas recorrentes que ainda
   não existem nele. Idempotente: usa uma chave de origem.
   ═══════════════════════════════════════════════════════════════ */

let materializando = false;

async function materializarRecorrentes(ym){
  if(materializando || !S.dataReady) return;
  if(ym < mesAtualISO()) return; // não cria retroativo

  const modelos = S.despesas.filter(d => d.recorrente && !d.origem);
  if(modelos.length === 0) return;

  const jaNoMes = new Set(
    S.despesas.filter(d => (d.vencimento||"").slice(0,7)===ym && d.origem)
              .map(d => d.origem)
  );

  const criar = modelos.filter(m => {
    if(jaNoMes.has(m.id)) return false;
    if((m.vencimento||"").slice(0,7) >= ym) return false; // o próprio modelo já é desse mês
    return true;
  });
  if(criar.length === 0) return;

  materializando = true;
  const lote = {};
  criar.forEach(m => {
    const dia = (m.vencimento||"").slice(8,10) || "01";
    const [y, mo] = ym.split("-").map(Number);
    const ultimoDia = new Date(y, mo, 0).getDate();
    const diaSeguro = String(Math.min(Number(dia), ultimoDia)).padStart(2,"0");

    lote[uid()] = {
      descricao: m.descricao,
      valor: Number(m.valor)||0,
      vencimento: `${ym}-${diaSeguro}`,
      categoria: m.categoria,
      divisao: m.divisao || "casal",
      adicionadoPor: m.adicionadoPor,
      pago: false,
      dataPagamento: null,
      pagoPor: null,
      recorrente: false,
      origem: m.id,
      criadoEm: new Date().toISOString()
    };
  });

  try{ await refLivro().child("despesas").update(lote); }
  catch(e){ /* silencioso */ }
  finally{ materializando = false; }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */

function render(){
  if(!S.authReady){ root.innerHTML = skeleton(); return; }
  if(!S.user){ root.innerHTML = viewGate(); montarGate(); return; }
  if(!S.dataReady){ root.innerHTML = viewTop() + skeleton(); return; }

  materializarRecorrentes(S.mesAtivo);

  const r = resumo(S.mesAtivo);
  root.innerHTML =
    viewTop() +
    `<main class="wrap">` +
      viewMonthNav() +
      viewLedgerCard(r) +
      viewToolbar(r) +
      viewLista(r) +
      `<div class="footer">livro compartilhado · ${esc(LIVRO_ID)}</div>` +
    `</main>` +
    viewFab();

  if(S.modal) montarModal();
  else fecharModalDom();
}

function skeleton(){
  return `<div class="wrap skeleton">
    <div class="sk" style="height:160px; margin-bottom:22px;"></div>
    <div class="sk" style="height:38px; margin-bottom:14px;"></div>
    <div class="sk" style="height:58px; margin-bottom:7px;"></div>
    <div class="sk" style="height:58px; margin-bottom:7px;"></div>
    <div class="sk" style="height:58px; opacity:.5;"></div>
  </div>`;
}

function viewTop(){
  const avs = S.perfis.map(p =>
    `<div class="avatar" style="background:${p.cor}" title="${esc(p.nome)}">${esc(inicial(p.nome))}</div>`
  ).join("");
  return `
  <div class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark">Livro de Contas</span>
        <span class="brand-sub">${esc(LIVRO_ID)}</span>
      </div>
      <div class="people">${avs}</div>
      <button class="iconbtn" data-act="tema" title="Alternar tema" aria-label="Alternar tema">${icTema()}</button>
      <button class="iconbtn" data-act="config" title="Configurações" aria-label="Configurações">${icGear()}</button>
    </div>
  </div>`;
}

function viewMonthNav(){
  const {nome, ano} = labelMes(S.mesAtivo);
  const ehAtual = S.mesAtivo === mesAtualISO();
  return `
  <div class="monthnav">
    <button data-act="mes" data-delta="-1" aria-label="Mês anterior">${icLeft()}</button>
    <button class="month-label" data-act="hoje">${esc(nome)} <span class="yr">${ano}</span></button>
    <button data-act="mes" data-delta="1" aria-label="Próximo mês">${icRight()}</button>
  </div>
  ${ehAtual ? "" : `<button class="today-jump" data-act="hoje">voltar para ${esc(labelMes(mesAtualISO()).nome)}</button>`}`;
}

function viewLedgerCard(r){
  const saldo = saldoAtual();
  const previsto = saldo - r.vlAberto;
  const ac = acerto(S.mesAtivo);

  let confNota = "Nunca conferido com o banco";
  if(S.saldoBaseEm){
    const d = diasDe(S.saldoBaseEm);
    confNota = d === 0 ? "Conferido hoje"
             : d === 1 ? "Conferido ontem"
             : `Conferido há <b>${d} dias</b>`;
  }

  let settleHtml = "";
  if(ac && !ac.quitado){
    settleHtml = `
    <div class="settle">
      <div class="avatar sm" style="background:${ac.devedor.cor}">${esc(inicial(ac.devedor.nome))}</div>
      <div class="settle-txt"><b>${esc(ac.devedor.nome)}</b> deve a <b>${esc(ac.credor.nome)}</b> para fechar o mês</div>
      <div class="settle-amt">${money(ac.valor)}</div>
    </div>`;
  } else if(ac && ac.quitado){
    settleHtml = `
    <div class="settle">
      ${icCheckSm()}
      <div class="settle-txt">Contas do casal empatadas neste mês</div>
    </div>`;
  }

  return `
  <section class="ledger-card">
    <div class="lc-head">
      <div>
        <p class="lc-eyebrow">Saldo em conta</p>
        <p class="lc-balance ${saldo<0?"neg":""}">
          ${money(saldo)}
          <button class="editbtn" data-act="editar-saldo" title="Conferir saldo" aria-label="Conferir saldo">${icPencil()}</button>
        </p>
        <p class="lc-note">${confNota}</p>
      </div>
    </div>

    <div class="lc-rule"></div>

    <div class="lc-body">
      <div class="lc-cell">
        <p class="k">A pagar no mês</p>
        <div class="v ${r.vlAberto>0?"debit":""}">${money(r.vlAberto)}</div>
        <p class="s">${r.nAbertas} em aberto</p>
      </div>
      <div class="lc-cell">
        <p class="k">Sobra prevista</p>
        <div class="v ${previsto<0?"debit":"ok"}">${money(previsto)}</div>
        <p class="s">depois de quitar tudo</p>
      </div>
      <div class="lc-cell">
        <p class="k">Já pago</p>
        <div class="v">${money(r.vlPago)}</div>
        <p class="s">${r.nPagas} de ${r.nTodas} contas</p>
      </div>
    </div>

    ${r.nTodas > 0 ? `
    <div class="paidbar">
      <div class="paidbar-track">
        <div class="paidbar-fill" style="width:${r.pctPago.toFixed(1)}%"></div>
        <div class="paidbar-late" style="width:${r.pctAtraso.toFixed(1)}%"></div>
      </div>
      <div class="paidbar-legend">
        <span>${Math.round(r.pctPago)}% quitado</span>
        <span>${r.nAtrasadas>0 ? `${r.nAtrasadas} atrasada${r.nAtrasadas>1?"s":""}` : "nada atrasado"}</span>
      </div>

}

function viewToolbar(r){
  const abas = [
    {id:"todas",     txt:"Todas",     n:r.nTodas},
    {id:"abertas",   txt:"Em aberto", n:r.nAbertas},
    {id:"atrasadas", txt:"Atrasadas", n:r.nAtrasadas, alerta:true},
    {id:"pagas",     txt:"Pagas",     n:r.nPagas}
  ];
  return `
  <div class="toolbar">
    <div class="segmented" role="tablist">
      ${abas.map(a=>`
        <button class="seg ${S.filtro===a.id?"active":""} ${a.alerta&&a.n>0?"alert":""}"
                data-act="filtro" data-filtro="${a.id}" role="tab" aria-selected="${S.filtro===a.id}">
          ${a.txt}<span class="cnt">${a.n}</span>
        </button>`).join("")}
    </div>
  </div>`;
}

function filtrar(r){
  let l = r.lista.slice();
  if(S.filtro==="abertas")   l = l.filter(d=>!d.pago);
  if(S.filtro==="pagas")     l = l.filter(d=>d.pago);
  if(S.filtro==="atrasadas") l = l.filter(atrasada);
  l.sort((a,b)=>{
    const c = (a.vencimento||"").localeCompare(b.vencimento||"");
    if(c) return c;
    return (a.descricao||"").localeCompare(b.descricao||"","pt-BR");
  });
  return l;
}

function viewLista(r){
  const l = filtrar(r);

  if(r.nTodas === 0){
    const {nome} = labelMes(S.mesAtivo);
    return `<div class="empty">
      ${icLivro()}
      <h3>${esc(nome)} ainda está em branco</h3>
      <p>Lance a primeira conta do mês. Se marcar como recorrente, ela aparece sozinha nos próximos.</p>
      <button class="btn btn-primary" data-act="nova">${icPlus()} Lançar despesa</button>
    </div>`;
  }
  if(l.length === 0){
    const txt = {
      abertas:"Tudo quitado neste mês. Bom trabalho.",
      pagas:"Nenhuma conta paga ainda neste mês.",
      atrasadas:"Nenhuma conta atrasada. Em dia."
    }[S.filtro] || "Nada encontrado neste filtro.";
    return `<div class="empty">${icCheckBig()}<h3>${esc(txt)}</h3></div>`;
  }

  // agrupa por data de vencimento
  const grupos = [];
  l.forEach(d => {
    const ult = grupos[grupos.length-1];
    if(ult && ult.data === d.vencimento) ult.itens.push(d);
    else grupos.push({ data:d.vencimento, itens:[d] });
  });

  return grupos.map(g => {
    const soma = g.itens.reduce((s,d)=>s+(Number(d.valor)||0),0);
    const late = g.data < hojeISO() && g.itens.some(d=>!d.pago);
    return `
    <div class="daygroup ${late?"is-late":""}">
      <div class="daygroup-head">
        <span class="daygroup-date">${esc(fmtDiaLongo(g.data))}</span>
        <span class="daygroup-line"></span>
        <span class="daygroup-sum">${moneyShort(soma)}</span>
      </div>
      ${g.itens.map(linha).join("")}
    </div>`;
  }).join("");
}

function linha(d){
  const c = cat(d.categoria);
  const p = pessoa(d.pagoPor || d.adicionadoPor);
  const late = atrasada(d);
  const dias = late ? diasDe(d.vencimento) : 0;

  const meta = [`<span class="tag" style="background:color-mix(in srgb, ${c.cor} 13%, transparent); color:${c.cor}">${esc(c.nome)}</span>`];
  if(d.divisao === "individual") meta.push(`<span>só ${esc(pessoa(d.adicionadoPor).nome)}</span>`);
  if(d.origem || d.recorrente) meta.push(`<span class="recur-icon" title="Recorrente">${icRepeat()}</span>`);
  if(late) meta.push(`<span class="late-flag">${dias}d em atraso</span>`);
  if(d.pago && d.dataPagamento) meta.push(`<span>pago ${esc(fmtData(d.dataPagamento))}</span>`);

  return `
  <div class="row ${d.pago?"paid":""}" style="border-left-color:${c.cor}" data-id="${esc(d.id)}">
    <button class="tickbox ${d.pago?"on":""}" data-act="quitar" data-id="${esc(d.id)}"
            title="${d.pago?"Reabrir conta":"Marcar como paga"}"
            aria-label="${d.pago?"Reabrir conta":"Marcar como paga"}" aria-pressed="${!!d.pago}">${icCheck()}</button>
    <div class="row-main">
      <div class="row-desc">${esc(d.descricao)}</div>
      <div class="row-meta">${meta.join("")}</div>
    </div>
    <div class="row-right">
      <div class="avatar sm" style="background:${p.cor}" title="${esc(p.nome)}">${esc(inicial(p.nome))}</div>
      <div class="row-amt">${money(d.valor)}</div>
      <button class="row-menu" data-act="menu-linha" data-id="${esc(d.id)}"
              title="Mais ações" aria-label="Mais ações">${icDots()}</button>
    </div>
  </div>`;
}

function viewFab(){
  return `<button class="fab" data-act="nova">${icPlus()} Nova despesa</button>`;
}

      </figcaption>
    </figure>

      <p class="gate-mark">Livro de Contas</p>
      <p class="gate-sub">${cadastro
        ? "Crie o acesso. Depois é só usar o mesmo livro nos dois celulares."
        : "Entre para ver as contas da casa."}</p>

      <div class="f wide" style="margin-bottom:13px;">
        <label for="g-email">E-mail</label>
        <input type="email" id="g-email" autocomplete="email" placeholder="voce@email.com">
      </div>
      <div class="f wide" style="margin-bottom:18px;">
        <label for="g-senha">Senha</label>
        <input type="password" id="g-senha" autocomplete="${cadastro?"new-password":"current-password"}" placeholder="mínimo 6 caracteres">
      </div>

      <button class="btn btn-primary btn-block" data-act="auth-go" ${S.authBusy?"disabled":""}>
        ${S.authBusy ? "Aguarde…" : (cadastro ? "Criar acesso" : "Entrar")}
      </button>

      ${S.authErr ? `<p class="gate-err">${esc(S.authErr)}</p>` : ""}

      <p class="gate-alt">
        ${cadastro ? "Já tem acesso?" : "Primeira vez aqui?"}
        <button data-act="auth-alt">${cadastro ? "Entrar" : "Criar acesso"}</button>
      </p>
    </div>
   </div>
  </div>`;
}

function montarGate(){
  const em = document.getElementById("g-email");
  const sn = document.getElementById("g-senha");
  if(em && !S.authBusy) em.focus();
  [em,sn].forEach(el => el && el.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); autenticar(); }
  }));
}

async function autenticar(){
  const email = (document.getElementById("g-email")||{}).value || "";
  const senha = (document.getElementById("g-senha")||{}).value || "";
  if(!email.trim() || !senha){ S.authErr = "Preencha e-mail e senha."; render(); return; }
  if(senha.length < 6){ S.authErr = "A senha precisa de pelo menos 6 caracteres."; render(); return; }

  S.authBusy = true; S.authErr = ""; render();
  try{
    if(S.authMode === "cadastro") await auth.createUserWithEmailAndPassword(email.trim(), senha);
    else                          await auth.signInWithEmailAndPassword(email.trim(), senha);
  }catch(e){
    const map = {
      "auth/invalid-email":"E-mail inválido.",
      "auth/user-not-found":"Não achamos esse e-mail. Crie o acesso primeiro.",
      "auth/wrong-password":"Senha incorreta.",
      "auth/invalid-credential":"E-mail ou senha incorretos.",
      "auth/email-already-in-use":"Esse e-mail já tem acesso. Faça login.",
      "auth/weak-password":"Escolha uma senha mais forte.",
      "auth/too-many-requests":"Muitas tentativas. Aguarde um minuto.",
      "auth/network-request-failed":"Sem conexão com a internet.",
      "auth/operation-not-allowed":"Ative o login por e-mail e senha no Firebase Console."
    };
    S.authErr = map[e.code] || "Não foi possível entrar. Tente de novo.";
  }finally{
    S.authBusy = false; render();
  }
}

function fecharModalDom(){
  const e = document.querySelector(".scrim");
  if(e) e.remove();
}

function montarModal(){
  fecharModalDom();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.dataset.act = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${conteudoModal()}</div>`;
  document.body.appendChild(scrim);

  const alvo = scrim.querySelector("[data-autofocus]")
            || scrim.querySelector("input:not([type=checkbox]), select");
  if(alvo) setTimeout(()=> alvo.focus(), 60);

  // toggle da data de pagamento no formulário
  const chk = scrim.querySelector("#f-jaPaga");
  if(chk) chk.addEventListener("change", ()=>{
    const bloco = scrim.querySelector("#blocoPagamento");
    if(bloco) bloco.hidden = !chk.checked;
  });

  scrim.addEventListener("keydown", e => {
    if(e.key === "Escape"){ S.modal = null; render(); }
    if(e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox"){
      e.preventDefault();
      const cta = scrim.querySelector(".sheet-foot .btn-primary, .sheet-foot .btn-danger");
      if(cta) cta.click();
    }
  });
}

}

function conteudoModal(){
  const m = S.modal;

  /* ---------- nova despesa ---------- */
  if(m.tipo === "nova"){

            <button type="button" class="pill on" data-pill="divisao" data-val="casal" style="color:var(--accent)">Dividida ao meio</button>

  if(m.tipo === "editar"){
    const d = S.despesas.find(x=>x.id===m.id);
    if(!d) return "";
    const cats = CATEGORIAS.map(c=>`<option value="${c.id}" ${c.id===d.categoria?"selected":""}>${esc(c.nome)}</option>`).join("");
    const div = d.divisao || "casal";
    return `
    <div class="sheet-head"><h3>Editar despesa</h3>
      <button class="iconbtn" data-act="fechar" aria-label="Fechar">${icX()}</button></div>
    <div class="sheet-body">
      <div class="grid2">
        <div class="f wide">
          <label for="e-desc">Descrição</label>
          <input type="text" id="e-desc" maxlength="60" value="${esc(d.descricao)}" data-autofocus>

          <label for="e-valor">Valor</label>
          <div class="money"><span>R$</span>
            <input type="number" id="e-valor" step="0.01" min="0.01" inputmode="decimal" value="${Number(d.valor)||0}">
          </div>
        </div>
        <div class="f">
          <label for="e-venc">Vencimento</label>
          <input type="date" id="e-venc" value="${esc(d.vencimento)}">
        </div>
        <div class="f wide">
          <label for="e-cat">Categoria</label>
          <select id="e-cat">${cats}</select>
        </div>
        <div class="f wide">
          <label>Lançado por</label>
          <div class="pills" id="pill-pessoa">${pillsPessoas(d.adicionadoPor,"pessoa")}</div>

      ${ehModelo
        ? `<button class="menu-item" data-act="parar-recorrencia" data-id="${esc(d.id)}">${icRepeat()} Parar de repetir todo mês</button>`
        : `<button class="menu-item" data-act="tornar-recorrente" data-id="${esc(d.id)}">${icRepeat()} Repetir todo mês</button>`}
      <button class="menu-item danger" data-act="confirmar-excluir" data-id="${esc(d.id)}">${icTrash()} Excluir</button>
    </div>`;
  }

  /* ---------- saldo ---------- */
  if(m.tipo === "saldo"){
    return `
    <div class="sheet-head"><h3>Conferir saldo</h3>
      <button class="iconbtn" data-act="fechar" aria-label="Fechar">${icX()}</button></div>

      <button class="iconbtn" data-act="fechar" aria-label="Fechar">${icX()}</button></div>

    </div>
    <div class="sheet-foot">
      <button class="btn btn-text" data-act="fechar">Fechar</button>
      <button class="btn btn-primary" data-act="salvar-config">Salvar</button>
    </div>`;
  }

  /* ---------- confirmações ---------- */
  if(m.tipo === "excluir"){
    const d = S.despesas.find(x=>x.id===m.id);
    if(!d) return "";
    return `
    <div class="sheet-head"><h3>Excluir despesa</h3></div>
    <div class="sheet-body">
      <p class="warnbox">Excluir <b>${esc(d.descricao)}</b> de ${money(d.valor)}?

      <button class="btn btn-text" data-act="fechar">Cancelar</button>
      <button class="btn btn-danger" data-act="limpar">Apagar tudo</button>
    </div>`;
  }

  return "";
}

function lerPill(scope, grupo, fallback){
  const el = scope.querySelector(`[data-pill="${grupo}"].on`);
  return el ? el.dataset.val : fallback;
}

async function salvarNova(scope){
  const desc  = (scope.querySelector("#f-desc").value||"").trim();
  const valor = parseFloat(scope.querySelector("#f-valor").value);
  const venc  = scope.querySelector("#f-venc").value;
  const cate  = scope.querySelector("#f-cat").value;
  const rec   = scope.querySelector("#f-recorrente").checked;
  const paga  = scope.querySelector("#f-jaPaga").checked;
  const dtPag = paga ? (scope.querySelector("#f-dataPag").value || hojeISO()) : null;
  const quem  = lerPill(scope,"pessoa", S.perfis[0].id);
  const divi  = lerPill(scope,"divisao","casal");

  if(!desc){ say("Dê um nome à despesa.", true); return; }
  if(!valor || valor <= 0){ say("Informe um valor maior que zero.", true); return; }
  if(!venc){ say("Escolha a data de vencimento.", true); return; }

  const id = uid();
  const d = {
    descricao:desc, valor, vencimento:venc, categoria:cate,
    divisao:divi, adicionadoPor:quem,
    pago:paga, dataPagamento:dtPag, pagoPor: paga ? quem : null,
    recorrente:rec, origem:null,
    criadoEm:new Date().toISOString()
  };

  S.modal = null;
  S.mesAtivo = venc.slice(0,7);
  await gravarDespesa(id, d);
  avisarN8N("criar_despesa", Object.assign({id}, d));
  say(rec ? "Lançada e marcada para repetir todo mês." : "Despesa lançada.");
  render();
}

async function salvarEdicao(id, scope){
  const d = S.despesas.find(x=>x.id===id);
  if(!d) return;
  const desc  = (scope.querySelector("#e-desc").value||"").trim();
  const valor = parseFloat(scope.querySelector("#e-valor").value);
  const venc  = scope.querySelector("#e-venc").value;
  const cate  = scope.querySelector("#e-cat").value;
  const quem  = lerPill(scope,"pessoa", d.adicionadoPor);
  const divi  = lerPill(scope,"divisao", d.divisao||"casal");

  if(!desc){ say("Dê um nome à despesa.", true); return; }
  if(!valor || valor <= 0){ say("Informe um valor maior que zero.", true); return; }
  if(!venc){ say("Escolha a data de vencimento.", true); return; }

  const patch = { descricao:desc, valor, vencimento:venc, categoria:cate,
                  adicionadoPor:quem, divisao:divi };
  S.modal = null;
  S.mesAtivo = venc.slice(0,7);
  await gravarDespesa(id, patch);
  avisarN8N("editar_despesa", Object.assign({id}, d, patch));
  say("Alterações salvas.");
  render();
}

async function quitar(id){
  const d = S.despesas.find(x=>x.id===id);
  if(!d) return;
  const patch = d.pago
    ? { pago:false, dataPagamento:null, pagoPor:null }
    : { pago:true,  dataPagamento:hojeISO(), pagoPor: d.adicionadoPor || S.perfis[0].id };

  // resposta otimista para o toque parecer instantâneo
  Object.assign(d, patch);
  render();
  const el = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if(el) el.classList.add("flash");

  await gravarDespesa(id, patch);
  avisarN8N("status_pagamento_alterado", Object.assign({id}, d));
}

async function duplicar(id){
  const d = S.despesas.find(x=>x.id===id);
  if(!d) return;
  S.modal = null;
  const novo = Object.assign({}, d, {
    pago:false, dataPagamento:null, pagoPor:null,
    recorrente:false, origem:null,
    descricao: d.descricao,
    criadoEm:new Date().toISOString()
  });
  delete novo.id;
  await gravarDespesa(uid(), novo);
  say("Despesa duplicada.");
  render();
}

async function alternarRecorrencia(id, ligar){
  S.modal = null;
  await gravarDespesa(id, { recorrente: ligar });
  say(ligar ? "Vai repetir todo mês a partir do próximo." : "Não repete mais.");
  render();
}

async function excluir(id){
  const d = S.despesas.find(x=>x.id===id);
  S.modal = null;
  await apagarDespesa(id);
  if(d) avisarN8N("excluir_despesa", Object.assign({id}, d));
  say("Despesa excluída.");
  render();
}

async function limparTudo(){
  S.modal = null;
  try{ await refLivro().child("despesas").remove(); say("Todas as despesas foram apagadas."); }
  catch(e){ say("Não foi possível apagar.", true); }
  render();
}

async function salvarSaldo(scope){
  const v = parseFloat(scope.querySelector("#s-valor").value);
  if(isNaN(v)){ say("Digite um valor.", true); return; }
  S.modal = null;
  await salvarMeta({ saldoBase:v, saldoBaseEm:hojeISO() });
  avisarN8N("saldo_conferido", { saldo:v, em:hojeISO() });
  say("Saldo conferido.");
  render();
}

async function salvarConfig(scope){
  const novos = S.perfis.map(p => {
    const el = scope.querySelector(`[data-perfil="${p.id}"]`);
    const nome = el ? el.value.trim().slice(0,20) : p.nome;
    return Object.assign({}, p, { nome: nome || p.nome });
  });
  S.modal = null;
  await salvarMeta({ perfis:novos });
  say("Configurações salvas.");
  render();
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */

document.addEventListener("click", e => {
  // pills de seleção
  const pill = e.target.closest("[data-pill]");
  if(pill){
    const grupo = pill.dataset.pill;
    pill.parentElement.querySelectorAll(`[data-pill="${grupo}"]`).forEach(b=>{
      b.classList.remove("on");
      b.style.color = "";
    });
    pill.classList.add("on");
    const dot = pill.querySelector(".dot");
    pill.style.color = dot ? dot.style.background : "var(--accent)";
    return;
  }

  const alvo = e.target.closest("[data-act]");
  if(!alvo) return;

  // clique fora do sheet fecha
  if(alvo.dataset.act === "scrim"){
    if(e.target === alvo){ S.modal = null; render(); }
    return;
  }

  const act   = alvo.dataset.act;
  const id    = alvo.dataset.id;
  const sheet = alvo.closest(".sheet");

  switch(act){
    case "tema": {
      const ordem = ["auto","light","dark"];
      S.tema = ordem[(ordem.indexOf(S.tema)+1) % 3];
      localStorage.setItem("tema", S.tema);
      document.documentElement.dataset.theme = S.tema;
      say({auto:"Tema automático", light:"Tema claro", dark:"Tema escuro"}[S.tema]);
      break;
    }
    case "mes":    S.mesAtivo = addMes(S.mesAtivo, Number(alvo.dataset.delta)); render(); break;
    case "hoje":   S.mesAtivo = mesAtualISO(); render(); break;
    case "filtro": S.filtro = alvo.dataset.filtro; render(); break;

    case "nova":         S.modal = {tipo:"nova"};             render(); break;
    case "editar-saldo": S.modal = {tipo:"saldo"};            render(); break;
    case "config":       S.modal = {tipo:"config"};           render(); break;
    case "menu-linha":   S.modal = {tipo:"menu", id};         render(); break;
    case "editar":       S.modal = {tipo:"editar", id};       render(); break;
    case "confirmar-excluir": S.modal = {tipo:"excluir", id}; render(); break;
    case "confirmar-limpar":  S.modal = {tipo:"limpar"};      render(); break;
    case "fechar":       S.modal = null;                      render(); break;

    case "quitar":   quitar(id); break;
    case "duplicar": duplicar(id); break;
    case "tornar-recorrente": alternarRecorrencia(id, true); break;
    case "parar-recorrencia": alternarRecorrencia(id, false); break;
    case "excluir":  excluir(id); break;
    case "limpar":   limparTudo(); break;

    case "salvar-nova":   if(sheet) salvarNova(sheet); break;
    case "salvar-edicao": if(sheet) salvarEdicao(id, sheet); break;
    case "salvar-saldo":  if(sheet) salvarSaldo(sheet); break;
    case "salvar-config": if(sheet) salvarConfig(sheet); break;

    case "auth-go":  autenticar(); break;
    case "auth-alt": S.authMode = S.authMode==="login" ? "cadastro" : "login"; S.authErr=""; render(); break;
    case "sair":
      S.modal = null;
      auth.signOut().then(()=> say("Você saiu."));
      break;
  }
});

document.addEventListener("keydown", e => {
  if(!S.user || S.modal) return;
  const digitando = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if(digitando) return;
  if(e.key === "n" || e.key === "N"){ e.preventDefault(); S.modal = {tipo:"nova"}; render(); }
  if(e.key === "ArrowLeft"){ S.mesAtivo = addMes(S.mesAtivo,-1); render(); }
  if(e.key === "ArrowRight"){ S.mesAtivo = addMes(S.mesAtivo, 1); render(); }
});

// sombra da topbar ao rolar
addEventListener("scroll", () => {
  const tb = document.getElementById("topbar");
  if(tb) tb.classList.toggle("scrolled", scrollY > 4);
}, {passive:true});

auth.onAuthStateChanged(u => {
  S.user = u;
  S.authReady = true;
  if(u){
    S.dataReady = false;
    ouvirDados();
  }else{
    desligarDados();
    S.dataReady = false;
    S.despesas = [];
    S.perfis = [];
    S.modal = null;
  }
  render();
});

render();
